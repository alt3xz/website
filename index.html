<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.75rem;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #000;
    }

    .glow-text {
      font-size: clamp(1.75rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.15;
      animation: glow 4s ease-in-out infinite;
    }

    .subtext {
      font-size: 0.9rem;
      font-weight: 400;
      color: #888;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .progress {
      width: min(220px, 60vw);
      height: 2px;
      background: #eee;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress .bar {
      width: 40%;
      height: 100%;
      background: #000;
      border-radius: 999px;
      animation: slide 4s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        opacity: 0.4;
        text-shadow:
          0 0 2px rgba(0, 0, 0, 0.3),
          0 0 6px rgba(0, 0, 0, 0.2);
      }
      50% {
        opacity: 1;
        text-shadow:
          0 0 6px rgba(0, 0, 0, 0.8),
          0 0 14px rgba(0, 0, 0, 0.5),
          0 0 28px rgba(0, 0, 0, 0.3),
          0 0 48px rgba(0, 0, 0, 0.15);
      }
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      transition: opacity 0.2s ease;
    }

    .hero.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .contact-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, calc(-50% + 60px));
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .contact-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%);
    }

    .contact-panel h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .contact-item {
      font-size: 1rem;
      color: #555;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact-item:hover {
      color: #000;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      padding: 1.25rem;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }

    .footer a {
      color: #888;
      text-decoration: none;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .footer a:hover {
      color: #000;
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <main class="hero" id="hero">
    <h1 class="glow-text">Website is<br>under construction</h1>
    <p class="subtext">I'm working on something new. Check back shortly.</p>
    <div class="progress"><div class="bar"></div></div>
  </main>

  <section class="contact-panel" id="contactPanel">
    <h2>Get in touch</h2>
    <a href="tel:+16185701690" class="contact-item">618-570-1691</a>
    <a href="mailto:contact@alexbellina.com" class="contact-item">contact@alexbellina.com</a>
  </section>

  <footer class="footer">
    <a>About</a>
    <a>Images</a>
    <a id="contactLink">Contact</a>
    <a>alexbellina.com</a>
  </footer>

  <script>
    const hero = document.getElementById('hero');
    const panel = document.getElementById('contactPanel');
    const contactLink = document.getElementById('contactLink');

    contactLink.addEventListener('click', () => {
      const open = panel.classList.toggle('open');
      hero.classList.toggle('hidden', open);
    });
  </script>
</body>
</html>
